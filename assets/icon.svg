<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Light blue sky gradient -->
        <linearGradient id="skyGradient" x1="0%" y1="0%" x2="40%" y2="100%">
            <stop offset="0%" style="stop-color:#8FCFF0;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0587F2;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Rounded square background -->
    <rect x="20" y="20" width="462" height="462" rx="150" ry="150" fill="url(#skyGradient)"/>

    <!-- Sound wave pattern -->
    <path d="M 80 256 Q 130 200, 180 256 T 280 256 T 380 256 T 432 256"
          stroke="white"
          stroke-width="8"
          fill="none"
          opacity="0.4"
          stroke-linecap="round"/>

    <path d="M 80 256 Q 130 220, 180 256 T 280 256 T 380 256 T 432 256"
          stroke="white"
          stroke-width="12"
          fill="none"
          opacity="0.3"
          stroke-linecap="round"/>

    <!-- Main sound wave -->
    <path d="M 60 256 Q 110 180, 160 256 T 260 256 T 360 256 T 452 256"
          stroke="white"
          stroke-width="16"
          fill="none"
          opacity="0.6"
          stroke-linecap="round"/>

    <!-- Simple lowercase 'a' -->
    <g transform="translate(256, 250)">
        <!-- Outer circle of the bowl -->
        <circle cx="-10" cy="0" r="70" fill="white"/>

        <!-- Inner hole to make it a ring -->
        <circle cx="-10" cy="0" r="42" fill="url(#skyGradient)"/>

        <!-- Vertical stem on the right -->
        <rect x="35" y="-50" width="32" height="120" fill="white" rx="16"/>
    </g>
</svg>
